name: Build & Deploy → RuStore

# Triggers on every push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.38.10"
  PACKAGE_NAME: ru.habitify.tracker

jobs:
  build-and-deploy:
    name: Build APK & Upload to RuStore
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source code ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 ────────────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── 3. Flutter ────────────────────────────────────────────────────────
      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ── 4. Dependencies ───────────────────────────────────────────────────
      - name: flutter pub get
        run: flutter pub get

      # ── 5. Unit tests ─────────────────────────────────────────────────────
      - name: Run unit tests
        run: flutter test

      # ── 6. Restore keystore from base64 secret ────────────────────────────
      # To generate KEYSTORE_BASE64:
      #   Linux/macOS: base64 -w 0 android/habitify-release.jks
      #   Windows:     certutil -encode android\habitify-release.jks tmp.b64
      #                (copy content between BEGIN/END CERTIFICATE lines)
      - name: Restore keystore → android/app/habitify-release.jks
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/habitify-release.jks

      # ── 7. Create android/key.properties from secrets ────────────────────
      # storeFile is relative to android/app/ (the Gradle module directory).
      - name: Create android/key.properties
        run: |
          cat > android/key.properties << 'PROPS'
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=habitify-release.jks
          PROPS

      # ── 8. Build signed release APK ───────────────────────────────────────
      # versionCode auto-increments with each CI run.
      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }}

      # ── 9. Deploy to RuStore ──────────────────────────────────────────────
      - name: Install Python deps
        run: pip3 install cryptography requests --quiet

      - name: Upload & submit to RuStore
        env:
          RUSTORE_COMPANY_ID: ${{ secrets.RUSTORE_COMPANY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
          PACKAGE_NAME:        ${{ env.PACKAGE_NAME }}
          WHATS_NEW:           ${{ github.event.head_commit.message }}
          APK_PATH:            build/app/outputs/flutter-apk/app-release.apk
          BUILD_NUMBER:        ${{ github.run_number }}
        run: python3 .github/scripts/rustore_deploy.py

      # ── 10. Keep APK as downloadable artifact (14 days) ──────────────────
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
